<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <style>
    :root{--green:#495e57;--yellow:#f4ce14;--cream:#edefee;--ink:#333}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:#fff}
    header{max-width:960px;margin:22px auto 12px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-weight:800;letter-spacing:3px;color:var(--green);font-size:19px}.brand span{color:#d7aa00}
    nav{background:var(--green);max-width:920px;margin:0 auto;display:flex;justify-content:center;flex-wrap:wrap}
    nav a{color:white;text-decoration:none;padding:13px 19px;font-size:14px}nav a:hover{background:#354740}
    main{max-width:920px;margin:28px auto;padding:0 22px;min-height:350px}
    .hero{background:var(--green);color:white;padding:28px;border-radius:6px}.hero h1{color:var(--yellow);margin:0 0 10px}
    .btn{display:inline-block;background:var(--green);color:white;border:0;border-radius:4px;padding:11px 17px;text-decoration:none;cursor:pointer;font-size:14px}
    .btn:hover{background:#354740}.form-wrap{max-width:470px;margin:0 auto}label{display:block;font-weight:bold;margin:14px 0 6px}
    .form-control{width:100%;padding:10px;border:1px solid #b7b7b7;border-radius:3px;font:inherit;background:#fff}
    .errorlist,.error{color:#a32323;font-size:14px}.help{font-size:13px;color:#666}.slot-note{padding:10px;background:#f7f6f2;border-radius:4px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f2;padding:16px;border-radius:5px;font-size:13px}
    table{border-collapse:collapse;width:100%;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:var(--green);color:white}
    footer{max-width:920px;margin:28px auto 0;padding:18px 22px;background:#edefee;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555}
    @media(max-width:600px){header{flex-direction:column}nav a{padding:12px 10px}main{padding:0 15px}}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<header><div class="brand">🍋 LITTLE <span>LEMON</span></div><div>Fresh Mediterranean food</div></header>
<nav><a href="{% url 'home' %}">Home</a><a href="{% url 'home' %}#about">About</a><a href="{% url 'home' %}#menu">Menu</a><a href="{% url 'book' %}">Book</a><a href="{% url 'reservations' %}">Reservations</a></nav>
<main>{% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
<footer><span>🍋 Little Lemon</span><span>© Little Lemon</span></footer>
{% block scripts %}{% endblock %}
</body></html>
